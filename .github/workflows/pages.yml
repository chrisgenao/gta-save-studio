name: Publish GTA Save Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-save-studio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and upload Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test editors
        run: npm test
      - name: Build static GitHub Pages site
        run: node scripts/build-pages.mjs
      - name: Confirm essential site files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/src/app.js
          test -s dist/src/styles.css
          test -s dist/favicon.svg
          test -s dist/sitemap.xml
          test -s dist/google1ed131ac7d6d9c0a.html
          grep -Fxq 'google-site-verification: google1ed131ac7d6d9c0a.html' dist/google1ed131ac7d6d9c0a.html
          echo 'Required site files and Google verification file verified.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy uploaded site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
